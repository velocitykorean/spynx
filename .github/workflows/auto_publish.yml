name: Auto Publish Songs to YouTube

on:
  schedule:
    # Run once daily at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      upload_youtube:
        description: 'Upload to YouTube? (auto = alternate days, true = force upload, false = skip)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  publish-song:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      GOOGLE_DRIVE_AUDIO_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_AUDIO_FOLDER_ID }}
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_IMAGE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libglib2.0-0 libsndfile1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required secrets
        run: |
          echo "Checking required environment variables..."
          echo ""

          required_secrets=(
            "GOOGLE_DRIVE_AUDIO_FOLDER_ID"
            "GOOGLE_DRIVE_IMAGE_FOLDER_ID"
            "GOOGLE_SERVICE_ACCOUNT_KEY"
            "YT_CLIENT_ID"
            "YT_CLIENT_SECRET"
            "YT_REFRESH_TOKEN"
            "FB_PAGE_ID"
            "FB_PAGE_ACCESS_TOKEN"
          )

          missing=0
          for secret in "${required_secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              echo "Missing: $secret"
              missing=1
            else
              echo "Found: $secret"
            fi
          done

          echo ""
          if [ $missing -eq 1 ]; then
            echo "Required secrets are missing! Pipeline cannot continue."
            exit 1
          fi

          echo "All required secrets present."

      - name: 📅 Check YouTube upload schedule (Alternate days)
        id: yt_schedule
        run: |
          INPUT_CHOICE="${{ github.event.inputs.upload_youtube }}"
          if [ "$INPUT_CHOICE" = "true" ]; then
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to TRUE."
          elif [ "$INPUT_CHOICE" = "false" ]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to FALSE."
          else
            # Alternate-day schedule based on UTC Day of the Year
            # Odd days (e.g. 283, 285...) = Upload to YouTube
            # Even days (e.g. 284, 286...) = Skip YouTube (1-day gap)
            DAY_OF_YEAR=$(date -u +%-j)
            echo "Current UTC Day of Year: $DAY_OF_YEAR"
            if [ $(( 10#$DAY_OF_YEAR % 2 )) -ne 0 ]; then
              echo "should_upload=true" >> "$GITHUB_OUTPUT"
              echo "✅ Today is a scheduled YouTube upload day (Day $DAY_OF_YEAR)."
            else
              echo "should_upload=false" >> "$GITHUB_OUTPUT"
              echo "⏸️ Today is an alternate off-day for YouTube (Day $DAY_OF_YEAR). Skipping YouTube upload (Facebook will still upload)."
            fi
          fi

      - name: Run automation pipeline
        env:
          UPLOAD_YOUTUBE: ${{ steps.yt_schedule.outputs.should_upload }}
        run: |
          echo "Starting SPYNX automation pipeline..."
          echo "Audio Folder: $GOOGLE_DRIVE_AUDIO_FOLDER_ID"
          echo "Image Folder: $GOOGLE_DRIVE_IMAGE_FOLDER_ID"
          echo "Upload to YouTube today: $UPLOAD_YOUTUBE"
          python auto_pipeline.py
          exit_code=$?

          if [ $exit_code -ne 0 ]; then
            echo "Pipeline failed with exit code $exit_code"
            exit $exit_code
          fi

          echo "Pipeline completed successfully"

      - name: Commit published songs log
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add -f published_songs.json

          if ! git diff --staged --quiet; then
            git commit -m "Update published songs log [skip ci]"
            for i in 1 2 3 4 5; do
              git pull origin main --rebase && git push origin main && break || sleep 5
            done
            echo "Committed and pushed published_songs.json successfully"
          else
            echo "No changes to commit"
          fi
