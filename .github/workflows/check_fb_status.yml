name: Check Facebook Status

on:
  workflow_dispatch:

jobs:
  check-fb:
    runs-on: ubuntu-latest
    steps:
      - name: Query Facebook Graph API
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 -c '
          import os, requests, json

          page_id = os.getenv("FB_PAGE_ID")
          token = os.getenv("FB_PAGE_ACCESS_TOKEN")

          print(f"=== CHECKING PAGE: {page_id} ===")
          # 1. Check Page details
          r_page = requests.get(f"https://graph.facebook.com/v21.0/{page_id}", params={"fields": "id,name,is_published,link", "access_token": token})
          print("Page info:", r_page.status_code, json.dumps(r_page.json(), indent=2))

          # 2. Check recent uploaded videos on page
          r_vids = requests.get(f"https://graph.facebook.com/v21.0/{page_id}/videos", params={"fields": "id,title,published,status,permalink_url,created_time", "limit": 5, "access_token": token})
          print("\nRecent videos on page:", r_vids.status_code, json.dumps(r_vids.json(), indent=2))

          # 3. Check published posts on page feed
          r_feed = requests.get(f"https://graph.facebook.com/v21.0/{page_id}/posts", params={"fields": "id,message,created_time,status_type,is_published,is_hidden", "limit": 5, "access_token": token})
          print("\nRecent feed posts:", r_feed.status_code, json.dumps(r_feed.json(), indent=2))

          # 4. Check specific video IDs from Oct 19 and Oct 20
          check_ids = ["1437965308296737", "2218446765691325", "1446237410746952"]
          for vid in check_ids:
              r_v = requests.get(f"https://graph.facebook.com/v21.0/{vid}", params={"fields": "id,title,published,is_published,is_hidden,status,publishing_phase,privacy,permalink_url", "access_token": token})
              print(f"\nVideo {vid} status:", r_v.status_code, json.dumps(r_v.json(), indent=2))
          '
